<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#11111b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="canonical" href="https://learnc0de.vercel.app/notes">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Coder">

<meta property="og:description" content="Every note you have written in any chapter, in one place, plus your progress and a backup. Everything stays in this browser.">

</head>
<body data-page="notes">

  <main class="ed">
    <div class="tabs" role="tablist"></div>
    <div class="crumb">Coder › Notes</div>
    <div class="view">
      <div class="welcome wide">

        <div class="pane" id="mine" data-tab="All notes" data-icon="notebook">
          <div id="nlib">
          <h1>Notes</h1>
          <div class="nhead">
            <p class="lead" id="nsub">Everything you wrote, in one place</p>
            <input id="nq" class="nsearch" type="search" placeholder="Search your notes" aria-label="Search your notes" autocomplete="off">
          </div>
          <div id="nlist"></div>
          </div>
          <div id="nread" hidden></div>
        </div>

      </div>
    </div>
  </main>

<script src="shell.js"></script>
<script src="md.js"></script>
<script src="noteeditor.js"></script>
<script>
const days = d => d.toISOString().slice(0, 10);
const doneList = load('coder:done') || [];
const fromId = id => all.find(x => slug(x.g) + '/' + slug(x.n) === id);
const colourOf = g => notes.find(n => n[0] === g);

// ---- every note written in any chapter, in course order
const mine = [];
for (let i = 0; i < localStorage.length; i++) {
  const k = localStorage.key(i);
  if (!k.startsWith('coder:notes:')) continue;
  const id = k.slice('coder:notes:'.length), e = fromId(id), text = load(k);
  if (e && typeof text === 'string' && text.trim()) mine.push({ id, e, text, order: all.indexOf(e) });
}
mine.sort((a, b) => a.order - b.order);

function drawNotes() {
  const q = $('#nq').value.trim().toLowerCase();
  const shown = mine.filter(m => !q || (m.text + ' ' + m.e.n + ' ' + m.e.g).toLowerCase().includes(q));
  $('#nsub').textContent = mine.length
    ? (q ? `${shown.length} of ${mine.length} notes match` : `${mine.length} ${mine.length === 1 ? 'note' : 'notes'} across ${new Set(mine.map(m => m.e.g)).size} ${new Set(mine.map(m => m.e.g)).size === 1 ? 'class' : 'classes'}`)
    : 'Everything you wrote, in one place';
  if (!mine.length) {
    $('#nlist').innerHTML = `<div class="nempty"><span class="ni">${icon('notebook')}</span><b>Start your journey</b><p>Open any chapter and write in the note panel beside it. Whatever you write there shows up here, grouped by class.</p><a class="btn" href="chapter.html#basic-python/printing-and-getting-input">Open the first chapter</a></div>`;
    return;
  }
  if (!shown.length) { $('#nlist').innerHTML = '<p class="note wide">No note matches that search.</p>'; return; }
  $('#nlist').innerHTML = '<div class="ngrid">' + shown.map(m => {
    const f = colourOf(m.e.g);
    return `<article class="ncard" tabindex="0" data-open="${esc(m.id)}" style="--c:var(--${f[2]})"><span class="ni">${icon(f[1])}</span><b class="nt">${esc(m.e.n)}</b><span class="ng">${esc(m.e.g)}</span><div class="nbody pv lesson">${mdParse(m.text).html}</div><footer><a href="chapter.html#${esc(m.id)}">Open chapter</a><button type="button" data-copy="${esc(m.id)}">Copy</button></footer></article>`;
  }).join('') + '</div>';
}
$('#nq').oninput = drawNotes;

const copyText = (m, b) => (navigator.clipboard ? navigator.clipboard.writeText(m.text) : Promise.reject())
  .then(() => { const t = b.textContent; b.textContent = 'Copied'; setTimeout(() => b.textContent = t, 1400); }).catch(() => {});

// open one note in the full editor; Back or Esc returns to the cards
let openId = null;
function readNote(id) {
  const m = mine.find(x => x.id === id), f = colourOf(m.e.g);
  openId = id;
  $('#nread').innerHTML = `<div class="nsolo" style="--c:var(--${f[2]})">
    <div class="nbar">
      <button type="button" class="nback" data-back>${icon('caret-left')}All notes</button>
      <span class="ntitle"><span class="ni">${icon(f[1])}</span><span><b>${esc(m.e.n)}</b><i>${esc(m.e.g)}</i></span></span>
      <a class="btn ghost" href="${pathById(m.id)}">Open chapter</a>
    </div>
    <div class="notepane" id="nedit"></div>
  </div>`;
  mountNote($('#nedit'), id, { onSave: text => { m.text = text; } });
  $('#nlib').hidden = true; $('#nread').hidden = false;
  $('.view').scrollTop = 0;
}
function closeNote() {
  if (openId) {
    const m = mine.find(x => x.id === openId), t = load('coder:notes:' + openId);
    if (typeof t === 'string' && t.trim()) m.text = t; else mine.splice(mine.indexOf(m), 1);   // an emptied note is gone
    openId = null;
  }
  $('#nread').hidden = true; $('#nlib').hidden = false;
  drawNotes();
}
$('#nread').addEventListener('click', e => { if (e.target.closest('[data-back]')) closeNote(); });
$('#nlist').addEventListener('click', e => {
  const b = e.target.closest('[data-copy]');
  if (b) return copyText(mine.find(x => x.id === b.dataset.copy), b);
  if (e.target.closest('a')) return;
  const card = e.target.closest('.ncard');
  if (card) readNote(card.dataset.open);
});
$('#nlist').addEventListener('keydown', e => {
  const card = e.target.closest && e.target.closest('.ncard');
  if (card && e.target === card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); readNote(card.dataset.open); }
});
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#nread').hidden) closeNote(); });
drawNotes();
</script>
</body>
</html>
